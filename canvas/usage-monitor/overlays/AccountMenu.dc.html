<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <meta name="dc:title" content="Account menu">
  <meta name="dc:frame" content="380x1045">
  <meta name="dc:placement" content="right">
  <meta name="dc:behavior" content="A popover anchored under the card's more button, aligned to its right edge; no scrim in the app. Arrow keys move, Enter picks, Escape or a click outside closes. Copy alias swaps its icon to a check for 1.5 s and shows Copied.">
</head>
<body>
<x-dc>
<helmet>
  <style>body { margin: 0; font-family: var(--font-sans); }</style>
</helmet>
<div style="position: relative; width: 380px; height: 1045px">
  <div style="position: absolute; top: 872px; right: 20px; display: flex; flex-direction: column; width: 256px; padding: 4px; border-radius: var(--radius-md); background: var(--color-surface-2); box-shadow: var(--shadow-pop); font: 400 var(--text-md)/1 var(--font-sans); color: var(--color-fg)">
    <div data-action="do:start the inline rename on the card" style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: var(--radius-sm); cursor: pointer">
      <dc-import name="Icon" glyph="pencil" size="15" hint-size="15px,15px"></dc-import><span>Rename</span>
    </div>
    <div data-action="do:copy the shell alias line for this account to the clipboard" style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: var(--radius-sm); background: var(--color-border); cursor: pointer">
      <dc-import name="Icon" glyph="terminal" size="15" hint-size="15px,15px"></dc-import>
      <span style="flex: 1; white-space: nowrap">Copy alias</span>
      <span data-bind="accounts[id=side].aliasName" style="font: 400 var(--text-xs)/1 var(--font-mono); color: var(--color-subtle)">claude-side-project</span>
    </div>
    <div data-action="do:open the config directory in the file manager" style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: var(--radius-sm); cursor: pointer">
      <dc-import name="Icon" glyph="folder" size="15" hint-size="15px,15px"></dc-import><span>Show config folder</span>
    </div>
    <div style="height: 1px; margin: 4px 6px; background: var(--color-border)"></div>
    <div data-action="open:RemoveAccount" style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: var(--radius-sm); color: var(--color-danger); cursor: pointer">
      <dc-import name="Icon" glyph="trash-2" size="15" hint-size="15px,15px"></dc-import><span>Remove account…</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
