<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <meta name="dc:title" content="Remove account">
  <meta name="dc:frame" content="380xauto">
  <meta name="dc:placement" content="bottom">
  <meta name="dc:behavior" content="A bottom sheet over a scrim; it slides up over 200ms. Focus starts on Cancel. Escape or a click on the scrim cancels. The delete-folder option only appears when the backend reports canDeleteDir (the app created the folder). The Remove label grows to Remove and delete when that box is checked.">
</head>
<body>
<x-dc>
<helmet>
  <style>body { margin: 0; font-family: var(--font-sans); }</style>
</helmet>
<div style="display: flex; flex-direction: column; gap: var(--space-4); width: 380px; padding: var(--space-5) var(--space-4) var(--space-4); box-sizing: border-box; border-radius: 16px 16px 0 0; background: var(--color-surface); border-top: 1px solid var(--color-border); color: var(--color-fg)">
  <div style="display: flex; align-items: center; gap: var(--space-3)">
    <dc-import name="ProviderMark" provider="claude" size="lg" data-bind="provider=accounts[id=side].provider" hint-size="36px,36px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font: 600 var(--text-lg)/1.2 var(--font-sans)">Remove <span data-bind="accounts[id=side].label">Side project</span>?</span>
      <span style="font: 400 var(--text-sm)/1.4 var(--font-sans); color: var(--color-muted)">Usage Monitor stops tracking it. Nothing else changes unless you check an option.</span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface-2)">
    <dc-import name="Checkbox" checked="false" hint-size="100%,20px">Also sign out of the Claude CLI</dc-import>
    <dc-import name="Checkbox" checked="true" hint-size="100%,40px">
      <div style="display: flex; flex-direction: column; gap: 3px">
        <span>Also delete the config folder</span>
        <span style="font: 400 var(--text-xs)/1.3 var(--font-mono); color: var(--color-subtle)">~/.usage-monitor/claude/side-project</span>
      </div>
    </dc-import>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2)">
    <dc-import name="Button" variant="secondary" label="Cancel" data-action="close" hint-size="100%,32px"></dc-import>
    <dc-import name="Button" variant="danger" label="Remove and delete" data-action="do:remove the account, deleting its folder" hint-size="100%,32px"></dc-import>
  </div>
</div>
</x-dc>
</body>
</html>
